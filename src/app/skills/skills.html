<section id="skillz" class="skills">
    <img class="bg-wave" src="assets/images/28. Hero Background.png" alt="">
        <div class="skill-container">
            <div class="skill-icons">
                @for (skill of skillsIcons; track skill.name) {
                    <div class="skill-item">
                        <img [src]="skill.image" [alt]="skill.image">
                        <span>{{skill.name}}</span>
                    </div>
                }
            </div>
            <div class="skill-text">
                <div class="over-title">
                    <h2>{{ 'SKILLS.TITLE' | translate }}</h2>
                </div>
                    <p>{{ 'SKILLS.TEXT' | translate }}</p>
                <div class="skill-text-another">
                    <h3>{{ 'SKILLS.LOOKING' | translate }}<span>{{ 'SKILLS.ANOTHER' | translate }}</span>?</h3>
                    <p>{{ 'SKILLS.LEARNING' | translate }}</p>
                </div>
                <div class="skill-btn">
                    <button (click)="scrollToContact()">{{ 'SKILLS.BUTTON' | translate }}</button>
                </div>
                
            </div>
        </div>
</section>
