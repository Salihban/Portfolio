<section id="Kontact" class="contact">

    <div class="headline">
        <h2>Contact</h2>
    </div>

    <div class="contact-wrapper">
        <div class="contact-text">
            <div class="head-contect-text">
                <h3>Got a problem to solve?</h3>
            </div>
            <div class="head-bottom-text">
                <p>
                    Encourage people to contact you and
                    describe what role you are interested in.
                    Show that you will add value to their projects through your work.
                </p>
                <p>Need a Frontend developer? <span>Contact me!</span></p>
            </div>
        </div>
        <div class="contact-formular">
            <div class="contact-input">
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email">
                <textarea class="message-field" placeholder="Your message"></textarea>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="privacy">
                <label for="privacy">I've read the <a href="#">privacy police</a>
                and agree too the processingof my data as outlined</label>
            </div>
            <div class="btn-contact">
                <button>send message</button>
            </div>
        </div>
    </div>
    <a class="go-up-btn" href="app-header">
    <img src="/assets/icons/4. Go up button.svg" alt=""></a>
</section>
